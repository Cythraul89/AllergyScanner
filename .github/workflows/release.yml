# Release pipeline — triggered by a v<major>.<minor>.<patch> tag.
# Contains NO build steps: the same gate as CI runs, then the same reusable build.yml
# (Android · iOS, each debug + release), then everything is
# attached to a GitHub Release. Version stamp comes from the tag.
#
# Debug artifacts are attached deliberately — they are what you ask a user to run when a
# release build misbehaves.
name: Flutter Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Required so the final job can create a Release and upload assets.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Same gate as CI — a tag must not skip analyse/test ───────────────────────
  analyze:
    name: Analyse & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: analyze
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.analyze.outputs.version }}
      retention-days: 7

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List collected artifacts
        run: ls -l artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
